[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quip-core = { path = "../quip-core" }
frost-ed25519 = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = "0.3"
rand_core = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[[bin]]
name = "xtask"
path = "src/main.rs"